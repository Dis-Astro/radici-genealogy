name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Request production SignPath signatures (approved project and policies required)
        type: boolean
        default: false
      store_package:
        description: Bind the MSIX to the real Partner Center identity (Store variables required)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate production signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          CERT: ${{ vars.SIGNPATH_CERT_THUMBPRINT }}
        shell: python
        run: |
          import os
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Production signing is allowed only on main')
          for name in ('API_TOKEN','ORGANIZATION','PROJECT','POLICY','CERT'):
              if not os.environ.get(name):
                  raise SystemExit('Missing approved SignPath configuration: '+name)
      - name: Download and verify locked official dependencies
        run: python scripts/build_windows.py prepare
      - name: Build Radici-owned executables from public source
        run: python scripts/build_windows.py binaries
      - name: Test first-use archive copying on synthetic files
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /platform:x64 /r:System.Web.Extensions.dll /out:.build/windows/ArchiveImportTests.exe store/ArchiveImportTests.cs desktop/ArchiveImport.cs
          if ($LASTEXITCODE -ne 0) { throw 'Archive import tests could not compile' }
          & .build/windows/ArchiveImportTests.exe "$env:RUNNER_TEMP\radici-import-tests"
          if ($LASTEXITCODE -ne 0) { throw 'Archive import safety tests failed' }
      - name: Test official Gramps engine and synthetic genealogy
        run: python scripts/build_windows.py test
      - name: Upload Radici binaries for origin verification
        id: binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radici-binaries
          path: .build/windows/bin/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Sign application binaries
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: radici-binaries-v1
          github-artifact-id: ${{ steps.binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: .build/windows/signed/binaries
      - name: Build explicitly unsigned preview installer
        if: github.event_name != 'workflow_dispatch' || !inputs.sign
        run: python scripts/build_windows.py installer --development-unsigned
      - name: Verify signed binaries and build installer containing their new hashes
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          SIGNPATH_CERT_THUMBPRINT: ${{ vars.SIGNPATH_CERT_THUMBPRINT }}
        run: python scripts/build_windows.py installer
      - name: Upload installer for origin verification
        id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radici-installer-before-final-signature
          path: .build/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Sign complete installer
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: radici-installer-v1
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: .build/windows/signed/installer
      - name: Verify final production signature and compute final checksum
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          SIGNPATH_CERT_THUMBPRINT: ${{ vars.SIGNPATH_CERT_THUMBPRINT }}
        run: python scripts/build_windows.py verify-release
      - name: Archive resulting installer, source, checksum and test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radici-desktop-result
          path: |
            .build/windows/dist/*
            .build/windows/Radici-*-sorgenti.zip
            .build/windows/build-report.json
            .build/windows/qa/native-tests.json
          if-no-files-found: error
          retention-days: 30
      - name: Build and validate a development MSIX
        if: github.event_name != 'workflow_dispatch' || !inputs.store_package
        run: python scripts/build_msix.py --development
      - name: Build the package for the actual Microsoft Store identity
        if: github.event_name == 'workflow_dispatch' && inputs.store_package
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: python scripts/build_msix.py --store-environment
      - name: Prepare official WebView2 on the disposable test VM if missing
        if: github.event_name != 'workflow_dispatch' || !inputs.store_package
        shell: pwsh
        run: |
          Add-Type -Path .build/windows/deps/sdk/lib/net462/Microsoft.Web.WebView2.Core.dll
          try { $version=[Microsoft.Web.WebView2.Core.CoreWebView2Environment]::GetAvailableBrowserVersionString($null) } catch { $version=$null }
          if (-not $version) {
            $process=Start-Process -FilePath .build/windows/deps/webview2-runtime.exe -ArgumentList '/silent /install' -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { throw 'Official WebView2 prerequisite installation failed' }
          }
      - name: Install, open, close and remove the MSIX in an isolated VM
        if: github.event_name != 'workflow_dispatch' || !inputs.store_package
        shell: pwsh
        run: |
          $package=Get-ChildItem .build/windows/store-output/*-BOZZA-NON-INSTALLABILE.msix | Select-Object -First 1 -ExpandProperty FullName
          ./store/Test-Msix.ps1 -Package $package -Output .build/windows/store-test
      - name: Archive unsigned MSIX candidates and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radici-msix-result
          path: |
            .build/windows/store-output/*
            .build/windows/store-test/integration-report.json
            .build/windows/store-test/window-ready.json
            .build/windows/store-test/window.png
          if-no-files-found: warn
          retention-days: 30
      - name: Archive failure diagnostics using synthetic test data only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: radici-build-diagnostics
          path: |
            .build/windows/qa/Registri/*.log
            .build/windows/qa/native-tests.json
            .build/windows/deps/extract.log
            .build/windows/store-test/*.json
          retention-days: 7
